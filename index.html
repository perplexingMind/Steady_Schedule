<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Steady Schedule</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      display: grid;
      place-items: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
    }
    .card {
      max-width: 640px;
      background: #111827;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 12px 40px rgba(0,0,0,.35);
    }
    h1 {
      margin-top: 0;
      font-size: 2.5rem;
    }
    p {
      line-height: 1.6;
      color: #cbd5e1;
    }
    a.button {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 20px;
      background: #38bdf8;
      color: #0f172a;
      text-decoration: none;
      border-radius: 10px;
      font-weight: bold;
    }
    a.button:hover {
      background: #7dd3fc;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Steady Schedule</h1>
    <p>Your simple, focused space for staying organized and keeping on track.</p>
    <a class="button" href="https://github.com/PerplexingMind/Steady_Schedule">View Project</a>
  </main>
</body>
</html>
