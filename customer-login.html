<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Customer login · Steady Schedule</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body class="auth-page"><header><div class="head"><a class="logo" href="index.html" aria-label="Home">Steady Schedule</a></div></header><main class="auth-flow tap-flow"><section class="auth-panel auth-intro"><div class="auth-intro-inner"><div class="auth-kicker">Customer</div><h1>Customer</h1><p>Find places, keep bookings, and sign in when you are ready.</p><div class="auth-scroll-hint">Tap to continue</div></div></section><section class="auth-panel auth-center" id="login-panel" hidden><div class="auth-box"><a href="index.html" style="color:var(--muted);font-size:13px;display:block;margin-bottom:24px">← Back</a><h1>Customer login</h1><p>Sign in to see starred places, bookings, and saved data.</p><div class="auth-error" id="auth-error"></div><div class="auth-success" id="auth-success"></div><input class="field" id="email" type="email" placeholder="Email"><input class="field" id="password" type="password" placeholder="Password"><button class="btn" style="width:100%" data-action="customer-signin">Sign in</button><button class="btn ghost" style="width:100%;margin-top:10px" data-action="customer-guest">Continue as guest</button><div class="auth-links">No account? <a href="customer-signup.html">Sign up</a> · <a href="customer-reset.html">Forgot password</a></div></div></section><button class="tap-reveal" id="tap-reveal">Tap to continue</button></main><div id="state-badge"></div><script>document.addEventListener("DOMContentLoaded",()=>{const b=document.getElementById("tap-reveal"),p=document.getElementById("login-panel"); if(b&&p){b.addEventListener("click",()=>{b.setAttribute("aria-pressed","true"); p.hidden=false; p.scrollIntoView({behavior:"smooth", block:"center"}); b.remove();});}});</script><script src="app.js"></script></body></html>
